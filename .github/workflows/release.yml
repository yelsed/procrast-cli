name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../procrast-${{ matrix.target }}.tar.gz procrast
          cd ../../..

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/procrast.exe -DestinationPath procrast-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: procrast-${{ matrix.target }}
          path: procrast-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            procrast-*.tar.gz
            procrast-*.zip

  deploy:
    name: Deploy binaries to backend
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload binaries to backend
        id: upload
        env:
          DEPLOY_SECRET: ${{ secrets.CLI_DEPLOY_SECRET }}
          BACKEND_URL: https://procrastination-station-xwi7hrqi.on-forge.com
        run: |
          failed=0
          for file in procrast-*.tar.gz procrast-*.zip; do
            [ -f "$file" ] || continue
            platform="${file#procrast-}"
            platform="${platform%.tar.gz}"
            platform="${platform%.zip}"
            echo "Uploading $file (platform: $platform, version: ${{ steps.version.outputs.version }})"
            if ! curl --fail-with-body --retry 3 --max-time 60 -v \
              -X POST "$BACKEND_URL/api/cli/releases" \
              -H "Authorization: Bearer $DEPLOY_SECRET" \
              -H "Accept: application/json" \
              -F "version=${{ steps.version.outputs.version }}" \
              -F "platform=$platform" \
              -F "binary=@$file"; then
              echo "::warning::Failed to upload $file to backend"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "::warning::Some binary uploads failed. The GitHub Release is fine — binaries just didn't reach the backend. Re-tag to retry."
            exit 1
          fi
